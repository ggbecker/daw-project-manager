name: Flutter CI/CD (Windows, macOS, Linux & Android)

# PERMISSÃO: Necessária para que a ação 'upload-release-asset' funcione.
permissions:
  contents: write 

# 1. Gatilhos do Workflow
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

  push:
    branches: [ main ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Variáveis de Configuração
env:
  FLUTTER_BASE_VERSION: 3.41.9

# 2. Jobs
jobs:
  # Unit Tests — runs on PRs, push to main, and tag releases
  unit_tests:
    name: Unit Tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_BASE_VERSION }} (Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_BASE_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Inject OAuth Credentials
        run: |
          chmod +x scripts/inject_secret.sh
          ./scripts/inject_secret.sh -d "${{ secrets.DESKTOP_CLIENT_ID }}" -s "${{ secrets.DESKTOP_CLIENT_SECRET }}" -a "${{ secrets.ANDROID_WEB_CLIENT_ID }}"
        env:
          DESKTOP_CLIENT_ID: ${{ secrets.DESKTOP_CLIENT_ID }}
          DESKTOP_CLIENT_SECRET: ${{ secrets.DESKTOP_CLIENT_SECRET }}
          ANDROID_WEB_CLIENT_ID: ${{ secrets.ANDROID_WEB_CLIENT_ID }}

      - name: Generate Hive Adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Run unit tests
        run: flutter test test/models/ test/services/ test/repository/

  # Job de Teste de Integração (para Pull Requests)
  test_pr_build:
    name: Test PR Build (Windows)
    needs: unit_tests
    if: github.event_name == 'pull_request'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_BASE_VERSION }} (Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_BASE_VERSION }}
          channel: 'stable' 

      # - name: Run Flutter Upgrade
      #   run: flutter upgrade

      - name: Get dependencies
        run: flutter pub get

      # Inject OAuth Credentials from GitHub Secrets
      - name: Inject OAuth Credentials
        run: |
            powershell -ExecutionPolicy Bypass -File scripts/inject_secret.ps1 `
              -DesktopClientId "${{ secrets.DESKTOP_CLIENT_ID }}" `
              -DesktopClientSecret "${{ secrets.DESKTOP_CLIENT_SECRET }}" `
              -AndroidWebClientId "${{ secrets.ANDROID_WEB_CLIENT_ID }}"
        env:
          DESKTOP_CLIENT_ID: ${{ secrets.DESKTOP_CLIENT_ID }}
          DESKTOP_CLIENT_SECRET: ${{ secrets.DESKTOP_CLIENT_SECRET }}
          ANDROID_WEB_CLIENT_ID: ${{ secrets.ANDROID_WEB_CLIENT_ID }}

      # Generate Hive Adapters
      - name: Generate Hive Adapters
        run: dart run build_runner build --delete-conflicting-outputs

      # Generate localization files
      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Precache Flutter Artifacts
        run: flutter precache

      - name: Build Test
        run: flutter build windows --release


  # Job UNIFICADO de Release/Upload (usando Matrix para Windows e macOS)
  release_build_upload:
    name: Build & Upload (${{ matrix.os_name }})
    needs: unit_tests
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}

    # Apple signing/notarization secrets, hoisted to job level so that step-level
    # `if:` conditions can actually read them via the env context. A step's own
    # `env:` block is NOT visible to that same step's `if:` condition (GitHub
    # Actions limitation), so declaring these only inside each step's `env:`
    # silently made every signing/notarization step's `if:` evaluate to false.
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    # Configura a Matriz
    strategy:
      matrix:
        include:
          # --- CONFIGURAÇÃO MAC OS (ZIP) ---
          - os: macos-latest
            os_name: macOS (ZIP)
            command: flutter build macos --release
            asset_path: build/macos/Build/Products/Release/DAW_Project_Manager-${{ github.ref_name }}.zip
            asset_name: DAW_Project_Manager_macOS_${{ github.ref_name }}.zip
            is_zip: true 
            asset_content_type: application/zip
            is_installer: false
            is_dmg: false
            
          # --- CONFIGURAÇÃO MAC OS (DMG) ---
          - os: macos-latest
            os_name: macOS (DMG)
            command: flutter build macos --release
            asset_path: build/macos/Build/Products/Release/DAW_Project_Manager-${{ github.ref_name }}.dmg
            asset_name: DAW_Project_Manager_macOS_${{ github.ref_name }}.dmg
            is_zip: false
            asset_content_type: application/x-apple-diskimage
            is_installer: false
            is_dmg: true
            
          # --- CONFIGURAÇÃO WINDOWS (INSTALADOR EXE) ---
          - os: windows-latest
            os_name: Windows
            command: flutter build windows --release
            asset_path: Output/DAW_Project_Manager_Installer_${{ github.ref_name }}.exe 
            asset_name: DAW_Project_Manager_Installer_${{ github.ref_name }}.exe
            is_zip: false 
            asset_content_type: application/vnd.microsoft.portable-executable 
            is_installer: true
            is_dmg: false

          # --- CONFIGURAÇÃO WINDOWS (MSIX) ---
          - os: windows-latest
            os_name: Windows (MSIX)
            command: flutter build windows --release
            asset_path: build/windows/x64/runner/Release/daw_project_manager.msix
            asset_name: DAW_Project_Manager_${{ github.ref_name }}.msix
            is_zip: false
            asset_content_type: application/msix
            is_installer: false
            is_msix: true
            is_dmg: false
            
    steps:
      - uses: actions/checkout@v4

      # 1. Setup Flutter (Canal STABLE)
      - name: Setup Flutter ${{ env.FLUTTER_BASE_VERSION }} (Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_BASE_VERSION }}
          channel: 'stable' 

      # - name: Run Flutter Upgrade
      #   run: flutter upgrade

      - name: Get dependencies
        run: flutter pub get

      # Inject OAuth Credentials from GitHub Secrets
      - name: Inject OAuth Credentials (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/inject_secret.ps1 `
            -DesktopClientId "${{ secrets.DESKTOP_CLIENT_ID }}" `
            -DesktopClientSecret "${{ secrets.DESKTOP_CLIENT_SECRET }}" `
            -AndroidWebClientId "${{ secrets.ANDROID_WEB_CLIENT_ID }}"
        env:
          DESKTOP_CLIENT_ID: ${{ secrets.DESKTOP_CLIENT_ID }}
          DESKTOP_CLIENT_SECRET: ${{ secrets.DESKTOP_CLIENT_SECRET }}
          ANDROID_WEB_CLIENT_ID: ${{ secrets.ANDROID_WEB_CLIENT_ID }}

      - name: Inject OAuth Credentials (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x scripts/inject_secret.sh
          ./scripts/inject_secret.sh -d "${{ secrets.DESKTOP_CLIENT_ID }}" -s "${{ secrets.DESKTOP_CLIENT_SECRET }}" -a "${{ secrets.ANDROID_WEB_CLIENT_ID }}"
        env:
          DESKTOP_CLIENT_ID: ${{ secrets.DESKTOP_CLIENT_ID }}
          DESKTOP_CLIENT_SECRET: ${{ secrets.DESKTOP_CLIENT_SECRET }}
          ANDROID_WEB_CLIENT_ID: ${{ secrets.ANDROID_WEB_CLIENT_ID }}

      # Generate Hive Adapters
      - name: Generate Hive Adapters
        run: dart run build_runner build --delete-conflicting-outputs

      # Generate localization files
      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Precache Flutter Artifacts
        run: flutter precache

      # 2.5. Sanitize ref name for file paths (replace slashes and invalid chars)
      - name: Sanitize ref name
        id: sanitize_ref
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "sanitized_ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            # For PRs, use PR number, for branches sanitize the name
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "sanitized_ref=pr${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            else
              # Replace slashes and other invalid chars with underscores
              SANITIZED=$(echo "${{ github.ref_name }}" | sed 's/[\/\\:*?"<>|]/_/g')
              echo "sanitized_ref=$SANITIZED" >> $GITHUB_OUTPUT
            fi
          fi
        shell: bash

      - name: Determine build version (tag/PR)
        id: build_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME}"
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            VERSION_NAME="0.0.0"
            VERSION_CODE="${GITHUB_RUN_NUMBER}"
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      # 2.9. Disable Xcode automatic code signing for macOS CI build.
      # The app is re-signed with the real Developer ID in the post-build step.
      # flutter build macos does not support passing xcodebuild settings via --,
      # so we patch project.pbxproj directly before building.
      - name: Disable Xcode automatic code signing (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          PBXPROJ="macos/Runner.xcodeproj/project.pbxproj"
          # Switch every build configuration from Automatic to Manual signing
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          # Clear the team so Xcode does not require a provisioning profile
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"
          # Use ad-hoc signing ("-") so no certificate or profile is needed.
          # Manual + no team still errors without an explicit identity.
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development"/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-"/g' "$PBXPROJ"

      # 2.95. Stamp the current year into the Windows version resource's LegalCopyright,
      # so the shipped .exe always shows the year it was actually built/released.
      - name: Update copyright year (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          sed -i "s/Copyright (C) [0-9]\{4\}/Copyright (C) $(date +%Y)/" windows/runner/Runner.rc

      # 3. Build
      - name: Build ${{ matrix.os_name }} Executable
        shell: bash
        run: |
          VERSION_NAME="${{ steps.build_version.outputs.version_name }}"
          VERSION_CODE="${{ steps.build_version.outputs.version_code }}"
          EXTRA_ARGS="--build-name=${VERSION_NAME} --build-number=${VERSION_CODE} --dart-define=APP_VERSION=${VERSION_NAME}"
          ${{ matrix.command }} ${EXTRA_ARGS}
      
      # 4a. Code Sign macOS App Bundle (for DMG and ZIP) - MUST BE BEFORE ZIP/DMG CREATION
      # Note: If secrets are not set, signing will be skipped (useful for testing)
      - name: Import Signing Certificate
        if: ${{ (matrix.is_dmg == true || matrix.is_zip == true) && env.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          # Create keychain
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          # Import certificate
          # Use base64 -d (works on macOS GitHub Actions runners)
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          rm certificate.p12
      
      - name: Sign macOS App Bundle
        if: ${{ (matrix.is_dmg == true || matrix.is_zip == true) && env.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          # Sign the app bundle
          codesign --force --deep --sign "$APPLE_DEVELOPER_ID" \
            --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            build/macos/Build/Products/Release/DAWProjectManager.app
          
          # Verify the signature
          codesign --verify --verbose build/macos/Build/Products/Release/DAWProjectManager.app
          
      # 4b. Notarize macOS App (optional but recommended)
      - name: Notarize macOS App
        if: ${{ (matrix.is_dmg == true || matrix.is_zip == true) && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          # Create a zip for notarization
          cd build/macos/Build/Products/Release
          zip -r daw_project_manager_notarize.zip DAWProjectManager.app
          
          # Submit for notarization
          xcrun notarytool submit daw_project_manager_notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m
          
          # Staple the notarization ticket
          xcrun stapler staple DAWProjectManager.app
          xcrun stapler validate DAWProjectManager.app
          
          # Clean up
          rm daw_project_manager_notarize.zip
          
      # 4c. Create DMG (Apenas para macOS DMG)
      - name: Install create-dmg
        if: matrix.is_dmg == true
        run: brew install create-dmg

      - name: Create macOS DMG
        if: matrix.is_dmg == true
        run: |
          APP="build/macos/Build/Products/Release/DAWProjectManager.app"
          DMG_OUT="build/macos/Build/Products/Release/DAW_Project_Manager-${{ steps.sanitize_ref.outputs.sanitized_ref }}.dmg"
          BACKGROUND="resources/macos/dmg_background.png"

          # create-dmg args depend on whether a custom background exists
          EXTRA_ARGS=()
          if [ -f "$BACKGROUND" ]; then
            EXTRA_ARGS+=(--background "$BACKGROUND")
          fi

          create-dmg \
            --volname "DAW Project Manager" \
            "${EXTRA_ARGS[@]}" \
            --window-pos 200 120 \
            --window-size 800 450 \
            --icon-size 100 \
            --icon "DAWProjectManager.app" 200 200 \
            --hide-extension "DAWProjectManager.app" \
            --app-drop-link 600 200 \
            "$DMG_OUT" \
            "$APP"
          
      # 4d. Sign DMG
      - name: Sign macOS DMG
        if: ${{ matrix.is_dmg == true && env.APPLE_DEVELOPER_ID != '' }}
        run: |
          DMG_PATH="build/macos/Build/Products/Release/DAW_Project_Manager-${{ steps.sanitize_ref.outputs.sanitized_ref }}.dmg"
          # Sign the DMG
          codesign --force --sign "$APPLE_DEVELOPER_ID" "$DMG_PATH"

          # Verify the DMG signature
          codesign --verify --verbose "$DMG_PATH"
          
      # 4. Zip (Apenas para macOS ZIP) - AFTER SIGNING
      - name: Zip macOS App Bundle
        if: matrix.is_zip == true
        run: |
          # macOS: Compacta o bundle .app (already signed)
          cd build/macos/Build/Products/Release
          zip -r DAW_Project_Manager-${{ steps.sanitize_ref.outputs.sanitized_ref }}.zip DAWProjectManager.app

      # 4e. Clean up keychain
      - name: Clean up keychain
        if: ${{ (matrix.is_dmg == true || matrix.is_zip == true) && env.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          security delete-keychain build.keychain || true

      # 5a. Cria o pacote MSIX (Apenas para Windows MSIX)
      - name: Create MSIX Package
        if: matrix.is_msix == true
        shell: bash
        run: |
          VERSION_NAME="${{ steps.build_version.outputs.version_name }}"
          VERSION_CODE="${{ steps.build_version.outputs.version_code }}"
          WINDOWS_BUILD_ARGS="--build-name=${VERSION_NAME} --build-number=${VERSION_CODE} --dart-define=APP_VERSION=${VERSION_NAME}"
          dart run msix:create --version "${VERSION_NAME}.0" --windows-build-args "${WINDOWS_BUILD_ARGS}"
          
      # 5. Instala e Compila o Instalador (Apenas para Windows)
      - name: Install Inno Setup
        if: matrix.is_installer == true
        run: choco install innosetup

      - name: Compile Windows Installer (ISCC)
        if: matrix.is_installer == true
        env:
          APP_VERSION: ${{ steps.build_version.outputs.version_name }}
        run: iscc installer.iss

      # 5.4. Rename Windows Installer to use sanitized ref name
      - name: Rename Windows Installer
        if: matrix.is_installer == true
        run: |
          # Find the installer file that was created (it will have the version from installer.iss)
          # The installer creates files like: DAW_Project_Manager_Installer_v1.5.4.exe
          $installerFile = Get-ChildItem -Path "Output" -Filter "DAW_Project_Manager_Installer_*.exe" | Select-Object -First 1
          if ($installerFile) {
            $newName = "DAW_Project_Manager_Installer_${{ steps.sanitize_ref.outputs.sanitized_ref }}.exe"
            Rename-Item -Path $installerFile.FullName -NewName $newName
            Write-Host "Renamed installer from $($installerFile.Name) to $newName"
          } else {
            Write-Host "Warning: No installer file found in Output directory"
          }
        shell: pwsh

      # 5.5. Set correct asset paths based on sanitized ref name
      - name: Set asset paths
        id: set_asset_paths
        run: |
          SANITIZED_REF="${{ steps.sanitize_ref.outputs.sanitized_ref }}"
          if [ "${{ matrix.is_zip }}" == "true" ]; then
            echo "asset_path=build/macos/Build/Products/Release/DAW_Project_Manager-${SANITIZED_REF}.zip" >> $GITHUB_OUTPUT
            echo "asset_name=DAW_Project_Manager_macOS_${SANITIZED_REF}.zip" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.is_dmg }}" == "true" ]; then
            echo "asset_path=build/macos/Build/Products/Release/DAW_Project_Manager-${SANITIZED_REF}.dmg" >> $GITHUB_OUTPUT
            echo "asset_name=DAW_Project_Manager_macOS_${SANITIZED_REF}.dmg" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.is_installer }}" == "true" ]; then
            echo "asset_path=Output/DAW_Project_Manager_Installer_${SANITIZED_REF}.exe" >> $GITHUB_OUTPUT
            echo "asset_name=DAW_Project_Manager_Installer_${SANITIZED_REF}.exe" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.is_msix }}" == "true" ]; then
            echo "asset_path=build/windows/x64/runner/Release/daw_project_manager.msix" >> $GITHUB_OUTPUT
            echo "asset_name=DAW_Project_Manager_${SANITIZED_REF}.msix" >> $GITHUB_OUTPUT
          else
            echo "asset_path=${{ matrix.asset_path }}" >> $GITHUB_OUTPUT
            echo "asset_name=${{ matrix.asset_name }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # 5.6. Generate a SHA256 checksum file for the release asset, so users
      # can verify their download. Works on both macOS (shasum) and the
      # Git Bash shell on windows-latest (sha256sum).
      - name: Generate SHA256 checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          ASSET_PATH="${{ steps.set_asset_paths.outputs.asset_path }}"
          ASSET_NAME="${{ steps.set_asset_paths.outputs.asset_name }}"
          if command -v sha256sum >/dev/null 2>&1; then
            CHECKSUM=$(sha256sum "$ASSET_PATH" | awk '{print $1}')
          else
            CHECKSUM=$(shasum -a 256 "$ASSET_PATH" | awk '{print $1}')
          fi
          echo "${CHECKSUM}  ${ASSET_NAME}" > "${ASSET_PATH}.sha256"

      # 6. Encontra a URL de Upload do Release existente (apenas para tags)
      - name: Find Existing Release URL
        if: startsWith(github.ref, 'refs/tags/v')
        id: find_release
        uses: actions/github-script@v6
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG,
              });
              core.setOutput('upload_url', release.upload_url);
              console.log(`Found Release URL: ${release.upload_url}`);
            } catch (error) {
              core.setFailed(`Release with tag ${process.env.RELEASE_TAG} not found. Please create a Release manually on GitHub matching this tag before pushing the tag.`);
            }

      # 7a. Upload do Artefato para Release (apenas para tags)
      - name: Upload ${{ matrix.os_name }} Release Asset
        # CONDIÇÃO DE SEGURANÇA: Só executa se a URL foi resolvida e é um tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.find_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.find_release.outputs.upload_url }}
          asset_path: ${{ steps.set_asset_paths.outputs.asset_path }}
          asset_name: ${{ steps.set_asset_paths.outputs.asset_name }}
          asset_content_type: ${{ matrix.asset_content_type }}

      # 7a.1 Upload the SHA256 checksum alongside the release asset
      - name: Upload ${{ matrix.os_name }} SHA256 Checksum
        if: startsWith(github.ref, 'refs/tags/v') && steps.find_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.find_release.outputs.upload_url }}
          asset_path: ${{ steps.set_asset_paths.outputs.asset_path }}.sha256
          asset_name: ${{ steps.set_asset_paths.outputs.asset_name }}.sha256
          asset_content_type: text/plain

      # 7b. Upload do Artefato para GitHub Actions Artifacts (apenas para pull requests)
      - name: Upload ${{ matrix.os_name }} Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_name }}_${{ steps.set_asset_paths.outputs.asset_name }}
          path: ${{ steps.set_asset_paths.outputs.asset_path }}
          retention-days: 7

  # Linux Build Job — plain tarball of the Flutter Linux bundle, for users who
  # don't use Flatpak. This does NOT depend on the flatpak-flutter vendoring
  # step below; it's a normal `flutter build linux` like any other platform.
  build_linux:
    name: Build & Upload (Linux)
    needs: unit_tests
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libayatana-appindicator3-dev libnotify-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter ${{ env.FLUTTER_BASE_VERSION }} (Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_BASE_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Inject OAuth Credentials
        run: |
          chmod +x scripts/inject_secret.sh
          ./scripts/inject_secret.sh -d "${{ secrets.DESKTOP_CLIENT_ID }}" -s "${{ secrets.DESKTOP_CLIENT_SECRET }}" -a "${{ secrets.ANDROID_WEB_CLIENT_ID }}"
        env:
          DESKTOP_CLIENT_ID: ${{ secrets.DESKTOP_CLIENT_ID }}
          DESKTOP_CLIENT_SECRET: ${{ secrets.DESKTOP_CLIENT_SECRET }}
          ANDROID_WEB_CLIENT_ID: ${{ secrets.ANDROID_WEB_CLIENT_ID }}

      - name: Generate Hive Adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Precache Flutter Artifacts
        run: flutter precache --linux

      - name: Sanitize ref name
        id: sanitize_ref
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "sanitized_ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "sanitized_ref=pr${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            SANITIZED=$(echo "${{ github.ref_name }}" | sed 's/[\/\\:*?"<>|]/_/g')
            echo "sanitized_ref=$SANITIZED" >> $GITHUB_OUTPUT
          fi

      - name: Determine build version (tag/PR)
        id: build_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME}"
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            VERSION_NAME="0.0.0"
            VERSION_CODE="${GITHUB_RUN_NUMBER}"
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Build Linux Bundle
        run: |
          VERSION_NAME="${{ steps.build_version.outputs.version_name }}"
          VERSION_CODE="${{ steps.build_version.outputs.version_code }}"
          flutter build linux --release --build-name="${VERSION_NAME}" --build-number="${VERSION_CODE}" --dart-define=APP_VERSION="${VERSION_NAME}"

      - name: Package tarball
        id: package
        run: |
          SANITIZED_REF="${{ steps.sanitize_ref.outputs.sanitized_ref }}"
          ASSET_NAME="DAW_Project_Manager_Linux_${SANITIZED_REF}.tar.gz"
          tar -C build/linux/x64/release/bundle -czf "${ASSET_NAME}" .
          echo "asset_path=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CHECKSUM=$(sha256sum "${{ steps.package.outputs.asset_path }}" | awk '{print $1}')
          echo "${CHECKSUM}  ${{ steps.package.outputs.asset_name }}" > "${{ steps.package.outputs.asset_path }}.sha256"

      - name: Find Existing Release URL
        if: startsWith(github.ref, 'refs/tags/v')
        id: find_release
        uses: actions/github-script@v6
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG,
              });
              core.setOutput('upload_url', release.upload_url);
              console.log(`Found Release URL: ${release.upload_url}`);
            } catch (error) {
              core.setFailed(`Release with tag ${process.env.RELEASE_TAG} not found. Please create a Release manually on GitHub matching this tag before pushing the tag.`);
            }

      - name: Upload Linux Release Asset
        if: startsWith(github.ref, 'refs/tags/v') && steps.find_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.find_release.outputs.upload_url }}
          asset_path: ${{ steps.package.outputs.asset_path }}
          asset_name: ${{ steps.package.outputs.asset_name }}
          asset_content_type: application/gzip

      - name: Upload Linux SHA256 Checksum
        if: startsWith(github.ref, 'refs/tags/v') && steps.find_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.find_release.outputs.upload_url }}
          asset_path: ${{ steps.package.outputs.asset_path }}.sha256
          asset_name: ${{ steps.package.outputs.asset_name }}.sha256
          asset_content_type: text/plain

      - name: Upload Linux Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Linux_${{ steps.package.outputs.asset_name }}
          path: ${{ steps.package.outputs.asset_path }}
          retention-days: 7

  # Flatpak Build Job — runs flatpak-flutter (https://github.com/TheAppgineer/flatpak-flutter)
  # to vendor the Flutter SDK + every pubspec.lock package as hashed sources,
  # then builds flatpak/com.bandpassrecords.dpm.yml offline with
  # flatpak-builder, exactly like Flathub's own infrastructure eventually
  # will. Runs on every PR and on tags — nothing here requires anything to be
  # pre-generated on a Linux machine anymore, CI does the whole thing itself.
  #
  # This does NOT produce what gets submitted to Flathub — Flathub builds
  # independently from the manifest once it's merged into flathub/flathub.
  # It proves the manifest is actually buildable, and (on a tagged release)
  # attaches a sideloadable .flatpak bundle so people can `flatpak install`
  # it directly while a real Flathub submission is pending/in review.
  #
  # `continue-on-error: true` for now: this is the first time this pipeline
  # has actually been run end-to-end (no Linux/flatpak tooling was available
  # to test it beforehand), so a failure here shouldn't block Windows/macOS/
  # Android artifacts while it gets debugged from the Actions log. Remove
  # once it's proven green a few times.
  build_flatpak:
    name: Build Flatpak (Flathub validation)
    needs: unit_tests
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          # flatpak/shared-modules is a submodule (provides libappindicator
          # for tray_manager's pkg-config requirement).
          submodules: true

      - name: Install flatpak & flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      # The manifest carries a `type: file` source for lib/config/secrets.dart
      # because flatpak-builder fetches the app from git inside the sandbox —
      # injecting into this checkout (like the other jobs do) would never
      # reach the build. Generate the file the manifest points at.
      - name: Generate OAuth secrets file for the Flatpak build
        run: |
          chmod +x scripts/inject_secret.sh
          ./scripts/inject_secret.sh -d "${{ secrets.DESKTOP_CLIENT_ID }}" -s "${{ secrets.DESKTOP_CLIENT_SECRET }}" -a "${{ secrets.ANDROID_WEB_CLIENT_ID }}"
          cp lib/config/secrets.dart flatpak/secrets.dart

      - name: Point manifest at the exact commit under test
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # The committed manifest's `git` source is pinned to a release tag,
          # which doesn't exist yet on a PR. flatpak-flutter's own
          # source-fetch step only understands `type: git` sources (it
          # clones the repo itself to inspect pubspec.lock) — a `type: dir`
          # source silently fails deep inside it (confirmed by running this
          # job) — so for CI validation we keep it a git source, just
          # repointed at this exact commit instead of the pinned tag.
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("flatpak/com.bandpassrecords.dpm.yml")
          text = p.read_text()
          replacement = (
              "      - type: git\n"
              f"        url: {os.environ['REPO_URL']}\n"
              f"        commit: {os.environ['COMMIT_SHA']}\n"
          )
          text, n = re.subn(
              r"      - type: git\n(?:.*\n)*?        commit: [0-9a-f]{40}\n",
              replacement,
              text,
          )
          assert n == 1, f"expected exactly one git source block to replace, replaced {n}"
          p.write_text(text)
          PY
          cat flatpak/com.bandpassrecords.dpm.yml

      - name: Set up flatpak-flutter
        run: |
          git clone --depth 1 https://github.com/TheAppgineer/flatpak-flutter.git /tmp/flatpak-flutter
          pip install -r /tmp/flatpak-flutter/requirements.txt
          echo "--- flatpak-flutter.py --help (authoritative CLI contract) ---"
          python3 /tmp/flatpak-flutter/flatpak-flutter.py --help

      - name: Generate vendored Flutter/pub sources
        working-directory: flatpak
        run: |
          # Snapshot mtimes everywhere plausible before running, so we can
          # find whatever the tool wrote even if it's not where expected —
          # the last run produced no visible output at all (no error, no
          # pubspec-sources.json, manifest byte-identical), so the previous
          # `ls -la`-only debugging wasn't enough to see what happened.
          touch /tmp/before_marker
          set -x
          # flatpak-flutter guesses the app module's name from the last
          # app-id segment (here, "dpm") and errors out if no module is
          # named that — our app module is named "daw-project-manager"
          # (see modules: in the manifest), so it has to be told explicitly.
          python3 /tmp/flatpak-flutter/flatpak-flutter.py --app-module daw-project-manager com.bandpassrecords.dpm.yml
          echo "exit code: $?"
          set +x
          echo "--- flatpak/ after generation (recursive) ---"
          find . -type f | sort
          echo "--- anything modified/created under /tmp or the workspace since before this step ---"
          find /tmp "$GITHUB_WORKSPACE" -newer /tmp/before_marker -type f 2>/dev/null | sort
          echo "--- diff of the manifest itself ---"
          git -C .. diff -- flatpak/com.bandpassrecords.dpm.yml || true

      - name: Build Flatpak (offline, from vendored sources)
        working-directory: flatpak
        run: |
          flatpak-builder --repo=repo --force-clean --sandbox --user \
            --install-deps-from=flathub build com.bandpassrecords.dpm.yml

      - name: Build .flatpak bundle
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: flatpak
        run: |
          flatpak build-bundle repo "../DAW_Project_Manager_${{ github.ref_name }}.flatpak" \
            com.bandpassrecords.dpm --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      # So the generated pubspec-sources.json (and anything else flatpak-flutter
      # produced) can be inspected/committed by hand once this is verified to
      # work, rather than only ever existing inside an ephemeral CI run.
      # This artifact is the Flathub submission bundle: flatpak-flutter
      # overwrites the manifest in place (its output filename is
      # <app-id>.yml, same as our input) and writes the vendored
      # modules/sources/patches under generated/. Together with
      # secrets.dart and the shared-modules submodule, these are exactly
      # the files that go into the flathub/com.bandpassrecords.dpm repo.
      # (.flatpak-builder/ is deliberately not included — it's a large
      # build cache, and upload-artifact skips hidden dirs by default.)
      - name: Upload generated Flathub sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-generated-sources
          path: |
            flatpak/com.bandpassrecords.dpm.yml
            flatpak/generated/
          retention-days: 14
          if-no-files-found: warn

      - name: Find Existing Release URL
        if: startsWith(github.ref, 'refs/tags/v')
        id: find_release
        uses: actions/github-script@v6
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG,
              });
              core.setOutput('upload_url', release.upload_url);
              console.log(`Found Release URL: ${release.upload_url}`);
            } catch (error) {
              core.setFailed(`Release with tag ${process.env.RELEASE_TAG} not found. Please create a Release manually on GitHub matching this tag before pushing the tag.`);
            }

      - name: Upload Flatpak Bundle to Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.find_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.find_release.outputs.upload_url }}
          asset_path: DAW_Project_Manager_${{ github.ref_name }}.flatpak
          asset_name: DAW_Project_Manager_${{ github.ref_name }}.flatpak
          asset_content_type: application/vnd.flatpak

  # Android Build Job (for both PRs and Releases)
  build-android:
    name: Build Android (${{ github.event_name == 'pull_request' && 'PR Test' || 'Release' }})
    needs: unit_tests
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter ${{ env.FLUTTER_BASE_VERSION }} (Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_BASE_VERSION }}
          channel: 'stable'

      # - name: Run Flutter Upgrade
      #   run: flutter upgrade

      - name: Get dependencies
        run: flutter pub get

      - name: Precache Flutter Artifacts
        run: flutter precache

      - name: Inject OAuth Credentials
        run: |
          chmod +x scripts/inject_secret.sh
          ./scripts/inject_secret.sh \
            -d "${{ secrets.DESKTOP_CLIENT_ID }}" \
            -s "${{ secrets.DESKTOP_CLIENT_SECRET }}" \
            -a "${{ secrets.ANDROID_WEB_CLIENT_ID }}"
        env:
          DESKTOP_CLIENT_ID: ${{ secrets.DESKTOP_CLIENT_ID }}
          DESKTOP_CLIENT_SECRET: ${{ secrets.DESKTOP_CLIENT_SECRET }}
          ANDROID_WEB_CLIENT_ID: ${{ secrets.ANDROID_WEB_CLIENT_ID }}

      - name: Setup Android Keystore (Release only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          mkdir -p android
          cat > android/key.properties << EOF
          storeFile=app/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Determine build version (tag/PR)
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME}"
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            VERSION_NAME="0.0.0"
            VERSION_CODE="${GITHUB_RUN_NUMBER}"
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      # Generate Hive Adapters
      - name: Generate Hive Adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Precache Flutter Artifacts
        run: flutter precache

      - name: Build Android App Bundle (AAB) - Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          flutter build appbundle --release --build-name "${{ steps.version.outputs.version_name }}" --build-number "${{ steps.version.outputs.version_code }}" --dart-define=APP_VERSION="${{ steps.version.outputs.version_name }}"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Generate AAB SHA256 checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          ASSET_NAME="DAW_Project_Manager_Android_${{ github.ref_name }}.aab"
          CHECKSUM=$(sha256sum "$AAB_PATH" | awk '{print $1}')
          echo "${CHECKSUM}  ${ASSET_NAME}" > "${AAB_PATH}.sha256"

      - name: Build Android APK - PR Test (unsigned)
        if: github.event_name == 'pull_request'
        run: |
          flutter build apk --debug --build-name "${{ steps.version.outputs.version_name }}" --build-number "${{ steps.version.outputs.version_code }}" --dart-define=APP_VERSION="${{ steps.version.outputs.version_name }}"
        continue-on-error: true

      - name: Build Android APK - Release (for testing)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          flutter build apk --release --split-per-abi --build-name "${{ steps.version.outputs.version_name }}" --build-number "${{ steps.version.outputs.version_code }}" --dart-define=APP_VERSION="${{ steps.version.outputs.version_name }}"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        continue-on-error: true

      - name: Find Existing Release URL
        if: startsWith(github.ref, 'refs/tags/v')
        id: find_release
        uses: actions/github-script@v6
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG,
              });
              core.setOutput('upload_url', release.upload_url);
              console.log(`Found Release URL: ${release.upload_url}`);
            } catch (error) {
              core.setFailed(`Release with tag ${process.env.RELEASE_TAG} not found. Please create a Release manually on GitHub matching this tag before pushing the tag.`);
            }

      - name: Upload AAB to Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.find_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.find_release.outputs.upload_url }}
          asset_path: build/app/outputs/bundle/release/app-release.aab
          asset_name: DAW_Project_Manager_Android_${{ github.ref_name }}.aab
          asset_content_type: application/vnd.android.package-archive

      - name: Upload AAB SHA256 Checksum
        if: startsWith(github.ref, 'refs/tags/v') && steps.find_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.find_release.outputs.upload_url }}
          asset_path: build/app/outputs/bundle/release/app-release.aab.sha256
          asset_name: DAW_Project_Manager_Android_${{ github.ref_name }}.aab.sha256
          asset_content_type: text/plain

      - name: Upload APK artifacts (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-pr-test
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
          if-no-files-found: ignore
        continue-on-error: true

      - name: Upload APK artifacts (Release - for testing)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 90
          if-no-files-found: ignore
        continue-on-error: true

      - name: Create Release Summary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "## Android Release Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version Name:** ${{ steps.version.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version Code:** ${{ steps.version.outputs.version_code }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **AAB (App Bundle):** Uploaded to Release (required for Google Play Store)" >> $GITHUB_STEP_SUMMARY
          echo "- **APKs:** Available as artifacts (for testing)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the AAB from the Release page" >> $GITHUB_STEP_SUMMARY
          echo "2. Upload to Google Play Console" >> $GITHUB_STEP_SUMMARY
          echo "3. Complete the release process in Play Console" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Note on Play App Signing" >> $GITHUB_STEP_SUMMARY
          echo "This AAB is signed with your **upload key**. Google Play will re-sign it with the app signing key (managed by Google via Play App Signing) before distribution to users." >> $GITHUB_STEP_SUMMARY

      - name: Create PR Test Summary
        if: github.event_name == 'pull_request'
        run: |
          echo "## Android PR Build Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Android build completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type:** Debug (unsigned, for testing only)" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** Available as artifact (for testing)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Note" >> $GITHUB_STEP_SUMMARY
          echo "This is an unsigned debug build for PR validation. Release builds with signing are only created for tagged releases." >> $GITHUB_STEP_SUMMARY

  # Update the macOS download link on the gh-pages website after every tag release
  update-gh-pages:
    name: Update gh-pages download link
    needs: release_build_upload
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Update macOS DMG download URL in index.html
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NEW_URL="https://github.com/bandpassrecords/daw-project-manager/releases/download/${TAG}/DAW_Project_Manager_macOS_${TAG}.dmg"
          # Replace every hardcoded macOS DMG URL (any previous version) with the new one
          sed -i "s|https://github\.com/bandpassrecords/daw-project-manager/releases/download/[^/]*/DAW_Project_Manager_macOS_[^\"]*\.dmg|${NEW_URL}|g" index.html
          echo "Updated download URLs to: ${NEW_URL}"
          grep -n "DAW_Project_Manager_macOS" index.html

      - name: Commit and push to gh-pages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "Update macOS download link to ${TAG}" && git push