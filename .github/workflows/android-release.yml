name: Android Release Build

# Permissions needed for uploading artifacts
permissions:
  contents: write

# Triggers
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 1.0.0)'
        required: true
        type: string
      version_code:
        description: 'Version code (incrementing number)'
        required: true
        type: string
  push:
    tags:
      - 'android-v[0-9]+.[0-9]+.[0-9]+*'

# Environment variables
env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  build-android:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Run Flutter Upgrade
        run: flutter upgrade

      - name: Get dependencies
        run: flutter pub get

      - name: Inject OAuth Credentials
        run: |
          chmod +x scripts/inject_secret.sh
          ./scripts/inject_secret.sh \
            -d "${{ secrets.DESKTOP_CLIENT_ID }}" \
            -s "${{ secrets.DESKTOP_CLIENT_SECRET }}" \
            -a "${{ secrets.ANDROID_WEB_CLIENT_ID }}"
        env:
          DESKTOP_CLIENT_ID: ${{ secrets.DESKTOP_CLIENT_ID }}
          DESKTOP_CLIENT_SECRET: ${{ secrets.DESKTOP_CLIENT_SECRET }}
          ANDROID_WEB_CLIENT_ID: ${{ secrets.ANDROID_WEB_CLIENT_ID }}

      - name: Setup Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          mkdir -p android
          cat > android/key.properties << EOF
          storeFile=app/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version_name=${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT
            echo "version_code=${{ github.event.inputs.version_code }}" >> $GITHUB_OUTPUT
          else
            # Extract version from tag (e.g., android-v1.0.0 -> 1.0.0)
            TAG_NAME=${GITHUB_REF#refs/tags/android-v}
            echo "version_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            # Extract version code from tag or use timestamp
            VERSION_CODE=$(echo ${TAG_NAME} | tr -d '.' | cut -c1-9)
            echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          fi

      - name: Update version in pubspec.yaml
        run: |
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          
          # Update version in pubspec.yaml
          sed -i "s/^version: .*/version: $VERSION_NAME+$VERSION_CODE/" pubspec.yaml
          
          echo "Updated pubspec.yaml to version: $VERSION_NAME+$VERSION_CODE"

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle --release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build APK (for testing)
        run: |
          flutter build apk --release --split-per-abi
        continue-on-error: true

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 90
          if-no-files-found: ignore
        continue-on-error: true

      - name: Create Release Summary
        run: |
          echo "## Android Release Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version Name:** ${{ steps.version.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version Code:** ${{ steps.version.outputs.version_code }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **AAB (App Bundle):** Available for download (required for Google Play Store)" >> $GITHUB_STEP_SUMMARY
          echo "- **APKs:** Available for download (for testing)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the AAB artifact from the Actions page" >> $GITHUB_STEP_SUMMARY
          echo "2. Upload to Google Play Console" >> $GITHUB_STEP_SUMMARY
          echo "3. Complete the release process in Play Console" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Note on Play App Signing" >> $GITHUB_STEP_SUMMARY
          echo "This AAB is signed with your **upload key**. Google Play will re-sign it with the app signing key (managed by Google via Play App Signing) before distribution to users." >> $GITHUB_STEP_SUMMARY
