# Flatpak manifest for DAW Project Manager.
#
# This is a build-ready skeleton, not a tested one — flatpak-builder only
# runs on Linux and this repo is being packaged from Windows. Two pieces
# still need to be generated on a Linux machine (or WSL2) before this will
# actually build; see flatpak/README.md for the exact steps:
#
#   1. flutter-sdk.json  — pins the exact Flutter SDK build as a hashed
#      source, generated by the `flatpak-flutter` tool.
#   2. pubspec-sources.json — pins every package in pubspec.lock to a
#      hashed source, so `flutter pub get` never touches the network
#      during the Flathub build. Also generated by `flatpak-flutter`.
#
# Once generated, drop both files into this directory and merge their
# module/source stanzas in below where marked.

app-id: com.bandpassrecords.dpm
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: daw_project_manager

finish-args:
  # Rendering (GTK/Flutter Linux embedder).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # Google Drive sync: OAuth flow + Drive API calls.
  - --share=network

  # Deadline reminder notifications (flutter_local_notifications talks to
  # org.freedesktop.Notifications directly over D-Bus, not through the
  # notification portal).
  - --talk-name=org.freedesktop.Notifications

  # flutter_secure_storage on Linux stores OAuth tokens via libsecret /
  # the Secret Service API.
  - --talk-name=org.freedesktop.secrets

  # tray_manager's system tray icon (StatusNotifierItem protocol). Some
  # desktop environments don't run a StatusNotifierWatcher at all — the
  # tray icon silently not appearing there is a desktop-environment
  # limitation, not a sandboxing bug, and is not blocking for review.
  - --talk-name=org.kde.StatusNotifierWatcher

  # Deliberately NOT requesting --filesystem=host or --filesystem=home.
  # Every folder the scanner walks (see lib/services/scanner_service.dart)
  # is chosen through file_picker's Linux backend, which talks directly to
  # org.freedesktop.portal.FileChooser over D-Bus (see
  # file_picker/lib/src/linux/file_picker_linux.dart) rather than opening
  # its own dialog. The portal grants — and persists across app restarts —
  # access scoped to just the folder the user picked, which is exactly the
  # minimal-permission pattern Flathub review expects. No extra
  # --filesystem grant is needed for this to work.

modules:
  # --- BEGIN generated: flutter-sdk.json (see flatpak/README.md) ---
  # - flutter-sdk.json
  # --- END generated ---

  - name: daw-project-manager
    buildsystem: simple
    build-options:
      # Populated by the generated flutter-sdk module above; adjust the
      # path to wherever that module installs the `flutter` binary.
      append-path: /app/flutter-sdk/bin
      env:
        PUB_CACHE: /run/build/daw-project-manager/.pub-cache
    build-commands:
      - flutter build linux --release
      - install -Dm755 build/linux/x64/release/bundle/daw_project_manager /app/bin/daw_project_manager
      - cp -r build/linux/x64/release/bundle/data /app/bin/data
      - cp -r build/linux/x64/release/bundle/lib /app/bin/lib
      - install -Dm644 flatpak/com.bandpassrecords.dpm.desktop /app/share/applications/com.bandpassrecords.dpm.desktop
      - install -Dm644 flatpak/com.bandpassrecords.dpm.metainfo.xml /app/share/metainfo/com.bandpassrecords.dpm.metainfo.xml
      - install -Dm644 flatpak/icons/com.bandpassrecords.dpm_128.png /app/share/icons/hicolor/128x128/apps/com.bandpassrecords.dpm.png
      - install -Dm644 flatpak/icons/com.bandpassrecords.dpm_256.png /app/share/icons/hicolor/256x256/apps/com.bandpassrecords.dpm.png
    sources:
      - type: git
        url: https://github.com/bandpassrecords/daw-project-manager.git
        tag: v2.6.1
        commit: d61773779679f3137be72d095b4860557c069580

      # --- BEGIN generated: pubspec-sources.json (see flatpak/README.md) ---
      # - pubspec-sources.json
      # --- END generated ---
