# Flatpak manifest (template) for DAW Project Manager.
#
# This file is the INPUT to https://github.com/TheAppgineer/flatpak-flutter,
# not the final buildable manifest — that tool rewrites it (Flutter SDK
# module wired in, pubspec.lock vendored as hashed sources into
# pubspec-sources.json) so the actual Flathub build never touches the
# network. The `build_flatpak` job in .github/workflows/release.yml runs
# that step automatically on every PR and tag; see flatpak/README.md for
# how to do the same thing by hand on Linux/WSL2.

app-id: com.bandpassrecords.dpm
runtime: org.freedesktop.Platform
# Paired with sdk-extensions/llvm20 below to match flatpak-flutter's own
# template exactly (_generate_template_for_url in flatpak-flutter.py) —
# compiling Flutter's C++ engine needs clang++, which plain
# org.freedesktop.Sdk doesn't ship; the LLVM extension version has to match
# what's actually published for this runtime branch, and this is the
# combination the tool's own maintainers ship and test against.
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: daw_project_manager

finish-args:
  # Rendering (GTK/Flutter Linux embedder).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # Deliberately NO --share=network. The two things that would have
  # needed it are both switched off on Linux instead of granted the
  # permission: Google Drive sync (GoogleDriveSyncService.isSupported)
  # and the GitHub-releases update check (UpdateCheckService.isSupported —
  # redundant under Flatpak anyway, since Flathub already owns update
  # delivery via `flatpak update`/the software center, and linking a
  # Flatpak user to a GitHub release page to download an installer isn't
  # even the right flow for this distribution channel). That also means no
  # --talk-name for the Secret Service either (flutter_secure_storage,
  # which only Drive sync used, for OAuth refresh tokens).

  # Deadline reminder / work-timer notifications on Linux go through
  # org.freedesktop.portal.Notification (lib/services/linux_portal_notifier.dart)
  # instead of flutter_local_notifications' Linux backend, which talks to
  # org.freedesktop.Notifications directly, bypassing the portal — that's
  # why there's no --talk-name for notifications here: portal calls need
  # no special permission, sandboxed or not.

  # tray_manager's system tray icon (StatusNotifierItem protocol). Some
  # desktop environments don't run a StatusNotifierWatcher at all — the
  # tray icon silently not appearing there is a desktop-environment
  # limitation, not a sandboxing bug, and is not blocking for review.
  - --talk-name=org.kde.StatusNotifierWatcher

  # Deliberately NOT requesting --filesystem=host or --filesystem=home.
  # Every folder the scanner walks (see lib/services/scanner_service.dart)
  # is chosen through file_picker's Linux backend, which talks directly to
  # org.freedesktop.portal.FileChooser over D-Bus (see
  # file_picker/lib/src/linux/file_picker_linux.dart) rather than opening
  # its own dialog. The portal grants — and persists across app restarts —
  # access scoped to just the folder the user picked, which is exactly the
  # minimal-permission pattern Flathub review expects. No extra
  # --filesystem grant is needed for this to work.

modules:
  # tray_manager's Linux CMakeLists requires ayatana-appindicator3-0.1 or
  # appindicator3-0.1 via pkg-config, and plain org.freedesktop.Platform
  # doesn't ship either. Building it from the shared module Flathub apps
  # use for this (flatpak/shared-modules/ is a git submodule of
  # flathub/shared-modules) rather than pinning our own source archive —
  # this one builds legacy libappindicator, which provides
  # appindicator3-0.1. Must come before daw-project-manager in this list
  # so its pkg-config files exist by the time that module's CMake
  # configure step runs.
  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json

  # flatpak-flutter looks for a module named daw-project-manager (see
  # --app-module in the CI job) containing a `git` source whose url starts
  # with https://github.com/flutter/flutter and has a `tag:` — that's how
  # it decides which Flutter version to build from source, and it silently
  # no-ops (no error, nothing written) if that source is missing, which is
  # exactly what happened before this was added. It also expects
  # `build-options.append-path` to already contain a placeholder path
  # ending in "<dest>/bin" (dest: flutter below) — it rewrites that
  # specific entry to the real sandbox path, it doesn't add one from
  # scratch — and inserts `setup-flutter.sh` into build-commands right
  # before whichever command it finds first containing "flutter " or
  # "dart ". Do not remove any of that scaffolding as unused-looking.
  - name: daw-project-manager
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/llvm20/bin:/run/build/daw-project-manager/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        PUB_CACHE: /run/build/daw-project-manager/.pub-cache
    build-commands:
      # lib/config/oauth_config.dart is required to compile (it's a plain
      # Dart import, not conditional on platform) but its contents don't
      # matter here: Google Drive sync isn't offered on Linux at all (see
      # GoogleDriveSyncService.isSupported), so these values are compiled in
      # but never read. Using the committed template's placeholder text
      # directly — no real client ID, no secret, nothing to source from
      # anywhere, unlike Windows/macOS builds.
      - cp lib/config/oauth_config.dart.template lib/config/oauth_config.dart
      # APP_VERSION is read straight from com.bandpassrecords.dpm.metainfo.xml's
      # first <release version="..."> entry (the current release — by
      # convention the topmost/most-recent one; see that file's own
      # comment). That's a plain committed file, not derived from git, so
      # this works identically whether flatpak-builder does a shallow
      # clone, a full clone, or — if this source ever becomes a tarball
      # instead of a git checkout — an archive extraction with no git
      # metadata at all. Nothing to bump here on a release: bump
      # metainfo.xml itself instead. release.yml's "Verify metainfo.xml
      # version matches the tag" step fails the workflow if that's
      # forgotten, so this can't silently go stale the way a hardcoded
      # value here once did.
      #
      # ffmpeg_kit_flutter_new_audio is pinned to a vendored copy
      # (dependency_overrides -> third_party/ffmpeg_kit_flutter_new_audio)
      # whose Linux/macOS/Windows native layers are already stubbed to a
      # no-op in-repo. The upstream Linux CMakeLists downloads a ~19 MB
      # prebuilt ffmpeg bundle from GitHub at *configure* time and
      # FATAL_ERRORs without network, which this sandboxed offline build
      # can't do; the app never calls ffmpeg-kit on Linux anyway
      # (AudioAnalysisService shells out to a PATH ffmpeg there). Nothing to
      # patch at build time now — the vendored source is what gets built.
      - APP_VERSION=$(grep -o '<release version="[^"]*"' flatpak/com.bandpassrecords.dpm.metainfo.xml | head -1 | sed -E 's/.*version="([^"]*)".*/\1/');
        flutter build linux --release --no-pub --dart-define=APP_VERSION=${APP_VERSION:-0.0.0}
      # `flutter build linux` names the bundle directory after the *host*
      # architecture (build/linux/x64/... on x86_64, build/linux/arm64/... on
      # aarch64)
      # Only the launcher belongs in /app/bin — it's on PATH and is for
      # executables. The Flutter bundle's data/ and lib/ are not executables,
      # so the whole bundle goes to /app/<app-id> and the binary is symlinked
      # back. Exec=daw_project_manager in the .desktop file still resolves via
      # PATH, and the embedder still finds data/ and lib/ because it locates
      # them relative to the *resolved* /proc/self/exe — which follows the
      # symlink into /app/com.bandpassrecords.dpm.
      - BUNDLE=$(echo build/linux/*/release/bundle);
        install -Dm755 "$BUNDLE/daw_project_manager" /app/com.bandpassrecords.dpm/daw_project_manager;
        cp -r "$BUNDLE/data" /app/com.bandpassrecords.dpm/data;
        cp -r "$BUNDLE/lib" /app/com.bandpassrecords.dpm/lib;
        install -d /app/bin;
        ln -s /app/com.bandpassrecords.dpm/daw_project_manager /app/bin/daw_project_manager
      - install -Dm644 flatpak/com.bandpassrecords.dpm.desktop /app/share/applications/com.bandpassrecords.dpm.desktop
      - install -Dm644 flatpak/com.bandpassrecords.dpm.metainfo.xml /app/share/metainfo/com.bandpassrecords.dpm.metainfo.xml
      - install -Dm644 flatpak/icons/com.bandpassrecords.dpm_128.png /app/share/icons/hicolor/128x128/apps/com.bandpassrecords.dpm.png
      - install -Dm644 flatpak/icons/com.bandpassrecords.dpm_256.png /app/share/icons/hicolor/256x256/apps/com.bandpassrecords.dpm.png
    sources:
      # x-checker-data: once this manifest lives in the Flathub repo,
      # Flathub's flatpak-external-data-checker bot watches for new v* tags
      # on this repo and automatically opens a PR there bumping tag: and
      # commit: — combined with the git-describe-derived APP_VERSION above,
      # a release needs no manual manifest edits, just merging the bot's PR.
      - type: git
        url: https://github.com/bandpassrecords/daw-project-manager.git
        # Placeholder — this block is always rewritten before it's actually
        # used, by the "Point manifest at the exact commit under test" step
        # in .github/workflows/release.yml's build_flatpak job: a `commit:`
        # only (PR run, no tag exists yet) or `tag:` + `commit:` together (a
        # real tag push). That keeps this template from going stale between
        # releases — it used to hardcode a real tag/commit pair here, which
        # is exactly the kind of value that's easy to forget to bump.
        #
        # Only fill these in for real if you're bypassing that CI step
        # entirely — e.g. the README's manual "Local build/test" flow — in
        # which case: tag: vX.Y.Z, commit: <git rev-list -n 1 vX.Y.Z>.
        tag: PLACEHOLDER_REWRITTEN_BY_CI
        commit: 0000000000000000000000000000000000000000
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

      # Pinned to the same Flutter version the rest of CI builds with
      # (FLUTTER_BASE_VERSION in .github/workflows/release.yml) — keep
      # these in sync.
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: '3.41.9'
        dest: flutter
